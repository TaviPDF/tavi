# Baut Tavi für Windows und Mac und veröffentlicht das Release, sobald auf main eine neue Version liegt:
# Version in package.json erhöhen, Patch-Notes in notes/VERSION.md ablegen, pushen – fertig.
# Gibt es das Release vX.Y.Z schon, passiert nichts.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', 'notes/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.v.outputs.skip }}
      ver: ${{ steps.v.outputs.ver }}
    env:
      ELECTRON: 38.0.0
      PDFJS: 6.2.108
      RCS_VER: 0.29.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Neue Version?
        id: v
        run: |
          VER="$(node -p "require('./package.json').version")"
          echo "VER=$VER" >> "$GITHUB_ENV"; echo "TAG=v$VER" >> "$GITHUB_ENV"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER gibt es schon."
            echo "need_release=0" >> "$GITHUB_OUTPUT"
            if gh release view "v$VER" --json assets --jq '.assets[].name' | grep -q '\.msix$'; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          else
            echo "need_release=1" >> "$GITHUB_OUTPUT"
            test -f "notes/$VER.md" || { echo "notes/$VER.md fehlt"; exit 1; }
          fi

      - name: Werkzeuge installieren
        if: steps.v.outputs.skip != '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis zip unzip
          pip install --quiet pefile pillow
          npm install --no-save --silent --prefix "$RUNNER_TEMP/npm" "pdfjs-dist@$PDFJS"

      - name: Electron und rcodesign laden
        if: steps.v.outputs.skip != '1'
        run: |
          B="$RUNNER_TEMP/bau"; mkdir -p "$B/dl"; cd "$B/dl"
          get() { curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o "$1" "$2"; }
          base="https://github.com/electron/electron/releases/download/v$ELECTRON"
          get SHASUMS256.txt "$base/SHASUMS256.txt"
          for a in win32-x64 darwin-arm64 darwin-x64; do get "electron-v$ELECTRON-$a.zip" "$base/electron-v$ELECTRON-$a.zip"; done
          grep -E " \*electron-v$ELECTRON-(win32-x64|darwin-arm64|darwin-x64)\.zip$" SHASUMS256.txt | sha256sum -c -
          mv "electron-v$ELECTRON-win32-x64.zip" electron-win.zip
          mv "electron-v$ELECTRON-darwin-arm64.zip" electron-darwin-arm64.zip
          mv "electron-v$ELECTRON-darwin-x64.zip" electron-darwin-x64.zip
          get rcs.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$RCS_VER/apple-codesign-$RCS_VER-x86_64-unknown-linux-musl.tar.gz"
          tar xzf rcs.tgz
          echo "RCODESIGN=$B/dl/apple-codesign-$RCS_VER-x86_64-unknown-linux-musl/rcodesign" >> "$GITHUB_ENV"

      - name: Windows bauen (Installer, App-Paket, latest.json)
        if: steps.v.outputs.skip != '1'
        env:
          TAVI_SRC: ${{ github.workspace }}
          TAVI_PDFJS: ${{ runner.temp }}/npm/node_modules/pdfjs-dist
          MAKENSIS: makensis
        run: |
          export TAVI_BAU="$RUNNER_TEMP/bau"
          python3 build/release.py "$VER" "@notes/$VER.md"

      - name: Mac bauen
        if: steps.v.outputs.skip != '1'
        run: python3 build/mac.py "$RUNNER_TEMP/bau"

      - name: Windows-Programmordner für das Store-Paket weitergeben
        if: steps.v.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: win-app
          path: ${{ runner.temp }}/bau/win
          retention-days: 3

      - name: Release veröffentlichen
        if: steps.v.outputs.skip != '1' && steps.v.outputs.need_release == '1'
        run: |
          B="$RUNNER_TEMP/bau"
          files=("$B/release-$VER/Tavi-Setup-$VER.exe" "$B/release-$VER/tavi-app-$VER.json.gz" "$B/release-$VER/latest.json" \
                 "$B/mac-$VER/Tavi-$VER-mac-AppleSilicon.zip" "$B/mac-$VER/Tavi-$VER-mac-Intel.zip")
          gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Tavi $VER" --notes-file "notes/$VER.md" --latest

  # Microsoft-Store-Paket (MSIX) auf Windows mit makeappx bauen und ans Release hängen.
  # Hochladen ins Partner Center bleibt Handarbeit.
  store:
    needs: release
    if: needs.release.outputs.skip != '1'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.release.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - uses: actions/download-artifact@v4
        with:
          name: win-app
          path: ${{ runner.temp }}/bau/win
      - name: MSIX bauen
        shell: pwsh
        run: |
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mk) { throw "makeappx.exe nicht gefunden" }
          $env:MAKEAPPX = $mk.FullName
          python build/store.py "$env:RUNNER_TEMP\bau"
      - name: An das Release hängen
        shell: pwsh
        run: gh release upload "v$env:VER" "$env:RUNNER_TEMP\bau\store-$env:VER\Tavi-$env:VER.msix" --clobber
